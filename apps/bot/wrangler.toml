# Cloudflare Worker бота Voolo.
#
# Секретов здесь НЕТ и быть не должно. Файл лежит в гите.
# Секреты заливаются отдельно:
#
#   wrangler secret put BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put TP_TOKEN
#
# Лимиты бесплатного плана, которые реально жмут (см. ADR-002):
#   • 100 000 запросов в сутки
#   • ~10 мс CPU на запрос — ожидание сети не считается
#   • ~1000 записей в KV в сутки — поэтому сессии живут в D1, а не в KV

name = "voolo-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

# ── Несекретные переменные ───────────────────────────────────────

[vars]
DEFAULT_LOCALE = "ru"
DEFAULT_CURRENCY = "RUB"
FREE_SEARCHES_PER_DAY = "3"
FREE_RESULTS_LIMIT = "3"
PLUS_PRICE_STARS = "150"
PLUS_DURATION_DAYS = "30"
PLUS_MAX_WATCHES = "10"
ENVIRONMENT = "development"

# ── D1: основное хранилище ──────────────────────────────────────
# Пользователи, сессии, избранное, отслеживания, платежи.
# Создать: wrangler d1 create voolo-db — и вставить выданный id ниже.

[[d1_databases]]
binding = "DB"
database_name = "voolo-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "../../packages/db/migrations"

# ── KV: только дедуп апдейтов ────────────────────────────────────
# НИЧЕГО больше сюда не класть. Одна запись на апдейт при лимите ~1000/сутки
# и так близко к потолку. Сессии — в D1.

[[kv_namespaces]]
binding = "DEDUPE"
id = "REPLACE_WITH_KV_ID"

# ── Кэш ответов Travelpayouts ─────────────────────────────────────
# Сами данные у них уже кэшированы на дни, поэтому держать их час у себя
# — бесплатное снижение латентности без потери точности.

[[kv_namespaces]]
binding = "PRICE_CACHE"
id = "REPLACE_WITH_KV_CACHE_ID"

# ── Крон: проверка отслеживаемых цен ────────────────────────────────
# 06:00 UTC = 09:00 МСК. Кэш Aviasales обновляется раз в несколько дней,
# чаще раза в сутки ходить бессмысленно.

[triggers]
crons = ["0 6 * * *"]

# ── Продакшен ──────────────────────────────────────────────────

[env.production]
name = "voolo-bot-prod"
workers_dev = false

[env.production.vars]
DEFAULT_LOCALE = "ru"
DEFAULT_CURRENCY = "RUB"
FREE_SEARCHES_PER_DAY = "3"
FREE_RESULTS_LIMIT = "3"
PLUS_PRICE_STARS = "150"
PLUS_DURATION_DAYS = "30"
PLUS_MAX_WATCHES = "10"
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "voolo-db-prod"
database_id = "REPLACE_WITH_PROD_D1_ID"
migrations_dir = "../../packages/db/migrations"

[[env.production.kv_namespaces]]
binding = "DEDUPE"
id = "REPLACE_WITH_PROD_KV_ID"

[[env.production.kv_namespaces]]
binding = "PRICE_CACHE"
id = "REPLACE_WITH_PROD_KV_CACHE_ID"

[env.production.triggers]
crons = ["0 6 * * *"]
