# Cloudflare Worker бота Voolo.
#
# Секретов здесь НЕТ и быть не должно. Файл лежит в гите.
# Секреты заливаются отдельно:
#
#   wrangler secret put BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put TP_TOKEN
#
# Лимиты бесплатного плана, которые реально жмут (см. ADR-002):
#   • 100 000 запросов в сутки
#   • ~10 мс CPU на запрос — ожидание сети не считается
#   • D1: 100 000 записей и 5 млн чтений строк в сутки
#
# KV в проекте нет намеренно. У бесплатного KV ~1000 записей в сутки, а дедуп
# апдейтов пишет по записи на каждый апдейт — потолок наступает на первой сотне
# активных пользователей. Дедуп живёт в D1, кэш ответов Travelpayouts — на
# Cache API, который на Workers бесплатен и не имеет суточного лимита записей.

name = "voolo-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

# ── Несекретные переменные ──────────────────────────────────────────────────

[vars]
DEFAULT_LOCALE = "ru"
DEFAULT_CURRENCY = "RUB"
FREE_SEARCHES_PER_DAY = "3"
FREE_RESULTS_LIMIT = "3"
PLUS_PRICE_STARS = "150"
PLUS_DURATION_DAYS = "30"
PLUS_MAX_WATCHES = "10"
ENVIRONMENT = "development"

# ── D1: единственное хранилище ──────────────────────────────────────────────
# Пользователи, сессии, избранное, отслеживания, платежи, дедуп апдейтов.
# Создать: wrangler d1 create voolo-db — и вставить выданный id ниже.

[[d1_databases]]
binding = "DB"
database_name = "voolo-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "../../packages/db/migrations"

# ── Крон: проверка отслеживаемых цен ────────────────────────────────────────
# 06:00 UTC = 09:00 МСК. Кэш Aviasales обновляется раз в несколько дней,
# чаще раза в сутки ходить бессмысленно.

[triggers]
crons = ["0 6 * * *"]

# ── Продакшен ───────────────────────────────────────────────────────────────

[env.production]
name = "voolo-bot-prod"
workers_dev = false

[env.production.vars]
DEFAULT_LOCALE = "ru"
DEFAULT_CURRENCY = "RUB"
FREE_SEARCHES_PER_DAY = "3"
FREE_RESULTS_LIMIT = "3"
PLUS_PRICE_STARS = "150"
PLUS_DURATION_DAYS = "30"
PLUS_MAX_WATCHES = "10"
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "voolo-db-prod"
database_id = "REPLACE_WITH_PROD_D1_ID"
migrations_dir = "../../packages/db/migrations"

[env.production.triggers]
crons = ["0 6 * * *"]
