<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#141414" />
		<title>Voolo</title>

		<!--
			SDK Telegram обязан загружаться с домена telegram.org и до нашего кода:
			иначе window.Telegram.WebApp не существует в момент первого рендера.
			Самохостинг этого файла не поддерживается Telegram.
		-->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>

		<style>
			/* Первая краска до загрузки JS: без неё виден белый проблеск. */
			html,
			body,
			#root {
				height: 100%;
				margin: 0;
				background: #141414;
				color: #f5f5f5;
			}

			#boot {
				display: flex;
				height: 100%;
				align-items: center;
				justify-content: center;
				font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					sans-serif;
				color: #8a8a8a;
			}

			@media (prefers-reduced-motion: no-preference) {
				#boot span {
					animation: drift 1.4s ease-in-out infinite;
				}
			}

			@keyframes drift {
				0%,
				100% {
					transform: translateX(-6px);
					opacity: 0.6;
				}
				50% {
					transform: translateX(6px);
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div id="boot"><span>✈️</span></div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
